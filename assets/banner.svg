<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .grid-line {
      stroke: #374151;
      stroke-width: 0.5;
      opacity: 0.25;
    }
    .floating-orb {
      filter: blur(40px);
      opacity: 0.35;
      animation: pulse 8s ease-in-out infinite alternate;
    }
    .flow-wave {
      fill: none;
      stroke-width: 2;
      opacity: 0.3;
      stroke-dasharray: 8 12;
      animation: dashMove 30s linear infinite;
    }
    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      animation: floatBadge 6s ease-in-out infinite alternate;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #9ca3af;
      letter-spacing: 0.2px;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0% { transform: scale(1) translateY(0); opacity: 0.25; }
      50% { transform: scale(1.15) translateY(-10px); opacity: 0.45; }
      100% { transform: scale(1) translateY(0); opacity: 0.25; }
    }
    @keyframes floatBadge {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16" />

  <!-- Background Animated Luminous Orbs (Placed strictly behind text) -->
  <circle cx="150" cy="80" r="120" fill="#3b82f6" class="floating-orb" />
  <circle cx="1050" cy="260" r="140" fill="#8b5cf6" class="floating-orb" style="animation-delay: -3s;" />
  <circle cx="900" cy="70" r="90" fill="#06b6d4" class="floating-orb" style="animation-delay: -5s;" />

  <!-- Animated Stream Lines / Connectivity Mesh -->
  <path d="M -100,100 C 200,40 400,160 700,90 C 950,30 1100,140 1300,100" class="flow-wave" stroke="#60a5fa" />
  <path d="M -100,240 C 250,290 500,190 800,260 C 1050,310 1150,220 1300,240" class="flow-wave" stroke="#a78bfa" style="animation-duration: 24s; animation-direction: reverse;" />
  <path d="M -50,170 Q 300,220 600,160 T 1250,180" class="flow-wave" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" style="animation-duration: 36s;" />

  <!-- Subtle Blueprint Tech Grid -->
  <g>
    <line x1="100" y1="0" x2="100" y2="340" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="340" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="340" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="340" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="340" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="340" class="grid-line" />
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
  </g>

  <!-- Foreground Shield Emblem & Branding Header -->
  <g transform="translate(140, 170)">
    <!-- Security Shield Icon -->
    <g transform="translate(-65, -45) scale(0.9)" filter="url(#glow)">
      <path d="M40 0 L75 15 C 75 55 40 85 40 85 C 40 85 5 55 5 15 Z" fill="url(#shieldGrad)" />
      <path d="M40 8 L68 20 C 68 52 40 76 40 76 C 40 76 12 52 12 20 Z" fill="#0f172a" />
      <path d="M26 42 L36 52 L54 32" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Title (Strictly foreground, crisp gradient) -->
    <text x="35" y="-12" class="title-text" fill="url(#textGrad)">Awesome SOC 2 &amp; ISO 27001</text>
    <text x="35" y="28" class="title-text" fill="#f8fafc" font-size="34">Enterprise Data Privacy Controls</text>
    
    <!-- Subtitle (Always in front and sharp) -->
    <text x="37" y="68" class="subtitle-text">
      The Curated Matrix of Enterprise Compliance Automation, Privacy-as-Code &amp; GRC Platforms
    </text>
  </g>

  <!-- Dynamic Status Indicator Pills (Floating bottom row, spaced and clear) -->
  <g class="badge-pill" transform="translate(175, 290)">
    <!-- Pill 1: SOC 2 / ISO -->
    <g filter="url(#pillShadow)" style="animation-delay: 0s;">
      <rect x="0" y="-18" width="170" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="16" cy="-4" r="5" fill="#3b82f6" />
      <text x="30" y="0" fill="#e2e8f0">🛡️ SOC 2 &amp; ISO 27001</text>
    </g>

    <!-- Pill 2: Privacy / DSAR -->
    <g transform="translate(190, 0)" filter="url(#pillShadow)" style="animation-delay: -1.5s;">
      <rect x="0" y="-18" width="160" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
      <circle cx="16" cy="-4" r="5" fill="#a855f7" />
      <text x="30" y="0" fill="#e2e8f0">🔒 GDPR &amp; DSAR Flow</text>
    </g>

    <!-- Pill 3: Continuous Monitoring -->
    <g transform="translate(370, 0)" filter="url(#pillShadow)" style="animation-delay: -3s;">
      <rect x="0" y="-18" width="165" height="28" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="16" cy="-4" r="5" fill="#06b6d4" />
      <text x="30" y="0" fill="#e2e8f0">⚡ Continuous Audit</text>
    </g>

    <!-- Pill 4: Open Source vs SaaS -->
    <g transform="translate(555, 0)" filter="url(#pillShadow)" style="animation-delay: -4.5s;">
      <rect x="0" y="-18" width="175" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <circle cx="16" cy="-4" r="5" fill="#10b981" />
      <text x="30" y="0" fill="#e2e8f0">🌐 OSS &amp; SaaS Matrix</text>
    </g>
  </g>
</svg>